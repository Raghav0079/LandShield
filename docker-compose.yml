services:
  landshield:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./LandShield_Alert_System/.env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped