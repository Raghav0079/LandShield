[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ner-landslide"
version = "0.1.0"
description = "AI-enabled landslide susceptibility and early-warning pipeline for North East India"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NER Landslide Project" }]
dependencies = [
  "geopandas>=1.0,<2",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "planetary-computer>=1.0,<2",
  "pyarrow>=17,<24",
  "pystac-client>=0.8,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rasterio>=1.4,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "shapely>=2.0,<3",
  "streamlit>=1.40,<2",
  "streamlit-autorefresh>=1.0,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6",
  "types-requests>=2.32",
]

[project.scripts]
ner-landslide = "ner_landslide.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ner_landslide"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["network: tests that access public internet services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/ner_landslide/cli.py" = ["B008"]
"setup_and_run.py" = ["UP036"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ner_landslide"]
ignore_missing_imports = true
